<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estructura de la palabra · Docere et Delectare</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: #f4efe5;
    color: #2d2a26;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.contenedor {
    width: 100%;
    max-width: 950px;
    text-align: center;
}

h1 {
    font-size: 46px;
    margin: 0 0 10px;
    letter-spacing: 1px;
}

.subtitulo {
    font-size: 20px;
    color: #625b51;
    margin-bottom: 35px;
}

.panel {
    background: white;
    padding: 40px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

h2 {
    margin-top: 0;
}

.introduccion {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.bloques {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.bloque {
    border: none;
    border-radius: 15px;
    padding: 25px 18px;
    background: #eee8dc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.bloque:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.bloque.deshabilitado {
    opacity: 0.55;
    cursor: default;
}

.bloque.deshabilitado:hover {
    transform: none;
    box-shadow: none;
}

.icono {
    display: block;
    font-size: 35px;
    margin-bottom: 12px;
}

.descripcion {
    display: block;
    font-size: 14px;
    color: #625b51;
    margin-top: 8px;
    line-height: 1.4;
}

.boton {
    margin-top: 25px;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #ddd5c8;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    cursor: pointer;
}

.boton:hover {
    background: #cfc5b5;
}

#actividad,
#resultado {
    display: none;
}

.progreso-texto {
    display: flex;
    justify-content: space-between;
    color: #625b51;
    font-size: 15px;
    margin-bottom: 8px;
}

.barra {
    height: 12px;
    background: #eee8dc;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progreso {
    height: 100%;
    width: 0%;
    background: #8f8678;
    transition: width 0.3s;
}

#pregunta {
    font-size: 25px;
    line-height: 1.5;
    margin-bottom: 30px;
}

.opciones {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.opcion {
    padding: 20px;
    border: none;
    border-radius: 12px;
    background: #eee8dc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.opcion:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.12);
}

.opcion:disabled {
    cursor: default;
}

.correcta {
    background: #dce8d8 !important;
}

.incorrecta {
    background: #ead8d5 !important;
}

#feedback {
    margin-top: 25px;
    font-size: 17px;
    line-height: 1.6;
    text-align: left;
}

#nota {
    font-size: 48px;
    margin: 25px;
}

#mensaje {
    font-size: 20px;
    line-height: 1.6;
}

@media (max-width: 700px) {

    h1 {
        font-size: 35px;
    }

    .panel {
        padding: 25px;
    }

    .bloques,
    .opciones {
        grid-template-columns: 1fr;
    }

    #pregunta {
        font-size: 21px;
    }

}

</style>

</head>


<body>

<div class="contenedor">


<!-- ========================= -->
<!-- MENÚ PRINCIPAL -->
<!-- ========================= -->

<div class="panel" id="menu">

<h1>🧩 Estructura de la palabra</h1>

<div class="subtitulo">
Lengua Castellana y Literatura · 4.º ESO
</div>

<h2>¿Qué quieres practicar?</h2>

<div class="introduccion">

Explora los cuatro bloques sobre la estructura
y los procedimientos de formación de las palabras.

</div>


<div class="bloques">


<!-- BLOQUE 1 -->

<button class="bloque"
onclick="iniciarBloque1()">

<span class="icono">🧱</span>

<strong>1. Estructura de la palabra</strong>

<span class="descripcion">

Morfema · lexema · afijos ·
flexivos · derivativos · alomorfos · infijos

</span>

</button>


<!-- BLOQUE 2 -->

<button class="bloque deshabilitado"
onclick="proximamente()">

<span class="icono">🌱</span>

<strong>2. Derivación y composición</strong>

<span class="descripcion">

Próximamente

</span>

</button>


<!-- BLOQUE 3 -->

<button class="bloque deshabilitado"
onclick="proximamente()">

<span class="icono">🧬</span>

<strong>3. Parasíntesis y acronimia</strong>

<span class="descripcion">

Próximamente

</span>

</button>


<!-- BLOQUE 4 -->

<button class="bloque deshabilitado"
onclick="proximamente()">

<span class="icono">🏛️</span>

<strong>4. Formantes grecolatinos</strong>

<span class="descripcion">

Próximamente

</span>

</button>


</div>


<button class="boton"
onclick="volverMorfologia()">

← Volver a Morfología

</button>

</div>



<!-- ========================= -->
<!-- ACTIVIDAD BLOQUE 1 -->
<!-- ========================= -->

<div class="panel" id="actividad">

<div class="progreso-texto">

<span id="numeroPregunta">
Pregunta 1 de 20
</span>

<span id="porcentaje">
0%
</span>

</div>


<div class="barra">

<div class="progreso"
id="barraProgreso">
</div>

</div>


<h2>
🧱 Estructura de la palabra
</h2>


<div id="pregunta"></div>


<div class="opciones"
id="opciones">
</div>


<div id="feedback"></div>


<button class="boton"
id="siguiente"
onclick="siguientePregunta()">

Siguiente →

</button>


<br>


<button class="boton"
onclick="volverMenu()">

← Volver a los bloques

</button>

</div>



<!-- ========================= -->
<!-- RESULTADO -->
<!-- ========================= -->

<div class="panel"
id="resultado">

<h2>
🎉 ¡Actividad terminada!
</h2>

<div id="nota"></div>

<div id="mensaje"></div>


<button class="boton"
onclick="repetirActividad()">

🔄 Repetir actividad

</button>


<button class="boton"
onclick="volverMenu()">

← Volver a los bloques

</button>

</div>


</div>



<script>


/* ==========================================
   PREGUNTAS DEL BLOQUE 1
========================================== */

const preguntas = [

{
pregunta: "¿Qué es un morfema?",
opciones: [
"Una palabra formada por dos lexemas",
"La mínima unidad lingüística con significado",
"Un tipo de palabra compuesta",
"Una sílaba sin significado"
],
correcta: 1,
explicacion:
"El morfema es la mínima unidad lingüística con significado."
},

{
pregunta: "¿Qué aporta principalmente el lexema?",
opciones: [
"El significado léxico central",
"El género femenino",
"El número plural",
"El tiempo verbal"
],
correcta: 0,
explicacion:
"El lexema aporta el significado central y común a los términos de una familia léxica."
},

{
pregunta: "En «libros», ¿cuál es el lexema?",
opciones: [
"libr-",
"-o",
"-s",
"libros"
],
correcta: 0,
explicacion:
"«libr-» aporta el significado léxico de la palabra."
},

{
pregunta: "En «niñas», ¿qué morfema indica el género?",
opciones: [
"niñ-",
"-a",
"-s",
"niñas"
],
correcta: 1,
explicacion:
"En «niñas», «-a» es el morfema flexivo que indica género femenino."
},

{
pregunta: "En «libros», ¿qué morfema indica el número?",
opciones: [
"libr-",
"-o",
"-s",
"libro"
],
correcta: 2,
explicacion:
"«-s» es el morfema flexivo que indica número plural."
},

{
pregunta: "¿Cuál de estos elementos es un afijo derivativo?",
opciones: [
"-s en «casas»",
"re- en «releer»",
"-a en «niña»",
"-o en «libro»"
],
correcta: 1,
explicacion:
"«re-» es un afijo derivativo y, concretamente, un prefijo."
},

{
pregunta: "¿Dónde se sitúa normalmente un prefijo?",
opciones: [
"Delante del lexema",
"Detrás del lexema",
"Siempre entre dos lexemas",
"Solo al final de la palabra"
],
correcta: 0,
explicacion:
"Los prefijos son afijos derivativos que se sitúan delante del lexema."
},

{
pregunta: "¿Dónde se sitúa normalmente un sufijo?",
opciones: [
"Delante del lexema",
"Detrás del lexema",
"Siempre al principio de la palabra",
"Fuera de la palabra"
],
correcta: 1,
explicacion:
"Los sufijos son afijos derivativos que aparecen detrás del lexema."
},

{
pregunta: "¿Cuál de estos es un morfema flexivo?",
opciones: [
"re- en «releer»",
"-ez en «belleza»",
"-s en «libros»",
"im- en «imposible»"
],
correcta: 2,
explicacion:
"«-s» es un morfema flexivo porque indica número plural."
},

{
pregunta: "En los verbos, los morfemas flexivos pueden indicar...",
opciones: [
"Solo género",
"Tiempo, modo, número y persona",
"Solo número",
"Únicamente significado léxico"
],
correcta: 1,
explicacion:
"En los verbos, los morfemas flexivos pueden indicar tiempo, modo, número y persona."
},

{
pregunta: "¿Qué diferencia fundamental existe entre un morfema flexivo y uno derivativo?",
opciones: [
"El flexivo expresa valores gramaticales y el derivativo puede crear o modificar palabras",
"El derivativo siempre indica plural",
"El flexivo siempre es un prefijo",
"No existe ninguna diferencia"
],
correcta: 0,
explicacion:
"Los morfemas flexivos expresan valores gramaticales; los derivativos son afijos no flexivos que matizan o modifican el significado."
},

{
pregunta: "En «im-posible», ¿qué función tiene «im-»?",
opciones: [
"Es un sufijo flexivo",
"Es un prefijo derivativo",
"Es el lexema",
"Es un morfema de número"
],
correcta: 1,
explicacion:
"«im-» es un prefijo derivativo que aporta un significado de negación."
},

{
pregunta: "En «i-legal» e «in-negable», ¿qué relación existe entre «i-», «in-» e «im-»?",
opciones: [
"Son tres lexemas diferentes",
"Son variantes de un mismo morfema",
"Son morfemas flexivos de género",
"Son sufijos"
],
correcta: 1,
explicacion:
"«i-», «in-» e «im-» pueden entenderse como variantes o alomorfos de un mismo morfema de negación."
},

{
pregunta: "¿Qué es un alomorfo?",
opciones: [
"Una variante de un mismo morfema",
"Una palabra compuesta",
"Un lexema independiente",
"Un morfema que siempre indica plural"
],
correcta: 0,
explicacion:
"Un alomorfo es una variante de un morfema."
},

{
pregunta: "¿Cuál de estas series permite observar diferentes formas de un mismo morfema de negación?",
opciones: [
"im-posible / i-legal / in-negable",
"pan / mesa / libro",
"niño / niña / niños",
"flor / florista / florero"
],
correcta: 0,
explicacion:
"im-, i- e in- presentan distintas formas del morfema de negación."
},

{
pregunta: "En «sueñ-as» y «soñ-ar», ¿qué fenómeno puede observarse según los materiales?",
opciones: [
"Dos lexemas completamente diferentes",
"Dos alomorfos del lexema",
"Un prefijo y un sufijo",
"Un infijo"
],
correcta: 1,
explicacion:
"Los materiales presentan «sueñ-» y «soñ-» como alomorfos distintos del mismo lexema."
},

{
pregunta: "¿Qué es un infijo?",
opciones: [
"Un elemento de enlace situado en el interior de una palabra",
"Un prefijo derivativo",
"Un morfema que siempre indica plural",
"El significado central de una palabra"
],
correcta: 0,
explicacion:
"El infijo es un elemento de enlace situado en el interior de una palabra y no aporta significado."
},

{
pregunta: "En «panecillo», ¿qué función cumple el elemento de enlace?",
opciones: [
"Aporta el significado principal",
"Funciona como infijo y no aporta significado",
"Indica género",
"Es un prefijo"
],
correcta: 1,
explicacion:
"En «panecillo», el elemento de enlace funciona como infijo y no aporta significado."
},

{
pregunta: "¿Cuál de estas afirmaciones sobre los afijos derivativos es correcta?",
opciones: [
"Son siempre morfemas de número",
"Son afijos no flexivos",
"Solo aparecen en los verbos",
"Siempre se colocan detrás del lexema"
],
correcta: 1,
explicacion:
"Los afijos derivativos son los afijos no flexivos. Pueden ser prefijos o sufijos."
},

{
pregunta: "¿Cuál de estos análisis distingue correctamente lexema y morfemas flexivos?",
opciones: [
"niñ- + -a + -s → lexema + género + número",
"niñ- + -a + -s → tres lexemas",
"niñ- + -a + -s → prefijo + lexema + sufijo",
"niñ- + -a + -s → tres morfemas derivativos"
],
correcta: 0,
explicacion:
"En «niñas», «niñ-» es el lexema, «-a» expresa género y «-s» expresa número."
}

];


let preguntasActuales = [];

let preguntaActual = 0;

let puntuacion = 0;

let respondida = false;


/* ==========================================
   MEZCLAR
========================================== */

function mezclar(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* ==========================================
   INICIAR
========================================== */

function iniciarBloque1() {

    preguntasActuales = mezclar(preguntas);

    preguntaActual = 0;

    puntuacion = 0;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("resultado")
        .style.display = "none";

    document.getElementById("actividad")
        .style.display = "block";

    mostrarPregunta();

}


/* ==========================================
   MOSTRAR
========================================== */

function mostrarPregunta() {

    respondida = false;

    const pregunta =
        preguntasActuales[preguntaActual];


    document.getElementById("numeroPregunta")
        .textContent =
        "Pregunta " +
        (preguntaActual + 1) +
        " de " +
        preguntasActuales.length;


    const porcentaje =
        Math.round(
            (preguntaActual /
            preguntasActuales.length) * 100
        );


    document.getElementById("porcentaje")
        .textContent =
        porcentaje + "%";


    document.getElementById("barraProgreso")
        .style.width =
        porcentaje + "%";


    document.getElementById("pregunta")
        .textContent =
        pregunta.pregunta;


    document.getElementById("feedback")
        .innerHTML = "";


    document.getElementById("siguiente")
        .style.display = "none";


    const contenedor =
        document.getElementById("opciones");


    contenedor.innerHTML = "";


    pregunta.opciones.forEach(
        (opcion, indice) => {

            const boton =
                document.createElement("button");

            boton.className = "opcion";

            boton.textContent = opcion;

            boton.onclick =
                function() {

                    comprobarRespuesta(indice);

                };

            contenedor.appendChild(boton);

        }
    );

}


/* ==========================================
   COMPROBAR
========================================== */

function comprobarRespuesta(indice) {

    if (respondida) {
        return;
    }

    respondida = true;


    const pregunta =
        preguntasActuales[preguntaActual];


    const botones =
        document.querySelectorAll(".opcion");


    botones.forEach(
        (boton, posicion) => {

            boton.disabled = true;

            if (
                posicion === pregunta.correcta
            ) {

                boton.classList.add("correcta");

            }

        }
    );


    if (
        indice === pregunta.correcta
    ) {

        puntuacion++;

        document.getElementById("feedback")
            .innerHTML =
            "✅ <strong>¡Correcto!</strong><br><br>" +
            pregunta.explicacion;

    } else {

        botones[indice]
            .classList.add("incorrecta");

        document.getElementById("feedback")
            .innerHTML =
            "❌ <strong>No es correcto.</strong><br><br>" +
            "La respuesta correcta es: <strong>" +
            pregunta.opciones[pregunta.correcta] +
            "</strong><br><br>" +
            pregunta.explicacion;

    }


    document.getElementById("siguiente")
        .style.display =
        "inline-block";

}


/* ==========================================
   SIGUIENTE
========================================== */

function siguientePregunta() {

    preguntaActual++;


    if (
        preguntaActual <
        preguntasActuales.length
    ) {

        mostrarPregunta();

    } else {

        mostrarResultado();

    }

}


/* ==========================================
   RESULTADO
========================================== */

function mostrarResultado() {

    document.getElementById("actividad")
        .style.display =
        "none";

    document.getElementById("resultado")
        .style.display =
        "block";


    const nota =
        (
            puntuacion /
            preguntasActuales.length
        ) * 10;


    document.getElementById("nota")
        .textContent =
        nota.toFixed(1) +
        " / 10";


    let mensaje;


    if (nota >= 9) {

        mensaje =
            "🏆 ¡Excelente! Dominas muy bien la estructura de la palabra.";

    }

    else if (nota >= 7) {

        mensaje =
            "👏 ¡Muy bien! Tienes un buen dominio de estos contenidos.";

    }

    else if (nota >= 5) {

        mensaje =
            "👍 Has aprobado. Conviene seguir practicando algunos conceptos.";

    }

    else {

        mensaje =
            "📚 Necesitas repasar el bloque y volver a intentarlo.";

    }


    document.getElementById("mensaje")
        .textContent =
        mensaje;

}


/* ==========================================
   REPETIR
========================================== */

function repetirActividad() {

    iniciarBloque1();

}


/* ==========================================
   VOLVER AL MENÚ
========================================== */

function volverMenu() {

    document.getElementById("actividad")
        .style.display =
        "none";

    document.getElementById("resultado")
        .style.display =
        "none";

    document.getElementById("menu")
        .style.display =
        "block";

}


/* ==========================================
   VOLVER A MORFOLOGÍA
========================================== */

function volverMorfologia() {

    window.location.href =
        "morfologia.html";

}


/* ==========================================
   BLOQUES FUTUROS
========================================== */

function proximamente() {

    alert(
        "🚧 Este bloque estará disponible próximamente."
    );

}

</script>

</body>

</html>
