<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estructura de la palabra · Docere et Delectare</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: #f4efe5;
    color: #2d2a26;
    min-height: 100vh;
    padding: 30px 15px;
}

.contenedor {
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

.panel {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    text-align: center;
}

h1 {
    font-size: 44px;
    margin: 0 0 10px;
}

h2 {
    font-size: 28px;
    margin-top: 0;
}

h3 {
    margin-top: 25px;
}

.subtitulo {
    color: #625b51;
    font-size: 19px;
    margin-bottom: 35px;
}

.introduccion {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.bloques {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.bloque {
    border: none;
    border-radius: 16px;
    padding: 28px 20px;
    background: #eee8dc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.bloque:hover {
    transform: translateY(-4px);
    box-shadow: 0 7px 16px rgba(0,0,0,0.13);
}

.icono {
    display: block;
    font-size: 38px;
    margin-bottom: 12px;
}

.descripcion {
    display: block;
    font-size: 14px;
    color: #625b51;
    margin-top: 10px;
    line-height: 1.5;
}

.boton {
    margin-top: 25px;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #ddd5c8;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    cursor: pointer;
}

.boton:hover {
    background: #cfc5b5;
}

.boton-principal {
    background: #bcb1a0;
    color: white;
}

#actividad,
#resultado {
    display: none;
}

.progreso-texto {
    display: flex;
    justify-content: space-between;
    color: #625b51;
    font-size: 15px;
    margin-bottom: 8px;
}

.barra {
    height: 12px;
    background: #eee8dc;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progreso {
    height: 100%;
    width: 0%;
    background: #8f8678;
    transition: width 0.3s;
}

.etiqueta {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 20px;
    background: #eee8dc;
    color: #625b51;
    margin-bottom: 15px;
    font-size: 14px;
}

#pregunta {
    font-size: 24px;
    line-height: 1.5;
    margin: 20px 0;
}

.palabra {
    font-size: 36px;
    font-weight: bold;
    margin: 20px 0 30px;
}

.opciones {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.opcion {
    padding: 18px;
    border: none;
    border-radius: 13px;
    background: #eee8dc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.opcion:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.12);
}

.opcion:disabled {
    cursor: default;
}

.correcta {
    background: #dce8d8 !important;
}

.incorrecta {
    background: #ead8d5 !important;
}

.campo {
    width: 100%;
    max-width: 650px;
    padding: 14px;
    margin: 8px auto;
    border: 2px solid #ddd5c8;
    border-radius: 10px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    display: block;
}

.campo:focus {
    outline: none;
    border-color: #9b9183;
}

.etiqueta-campo {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

.segmentacion {
    font-size: 18px;
    color: #625b51;
    margin: 10px 0 20px;
}

.feedback {
    margin-top: 25px;
    padding: 18px;
    border-radius: 12px;
    background: #f7f4ee;
    text-align: left;
    line-height: 1.6;
}

#feedback:empty {
    display: none;
}

.exito {
    background: #e2eee0;
}

.error {
    background: #f0dfdc;
}

.lista-clasificacion {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 20px 0;
}

.clasificacion-btn {
    padding: 15px;
    border: 2px solid #ddd5c8;
    background: white;
    border-radius: 10px;
    cursor: pointer;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
}

.clasificacion-btn:hover {
    background: #eee8dc;
}

#siguiente {
    display: none;
}

#resultado {
    text-align: center;
}











.modal-contenido h2 {
    margin-top: 0;
}

.modal-contenido p {
    line-height: 1.6;
    color: #625b51;
}





















@media (max-width: 700px) {
    
}

#nota {
    font-size: 52px;
    font-weight: bold;
    margin: 25px;
}

#mensaje {
    font-size: 20px;
    line-height: 1.6;
}

.separador {
    height: 1px;
    background: #e5dfd4;
    margin: 30px 0;
}

.pequeno {
    color: #625b51;
    font-size: 14px;
    margin-top: 10px;
}

@media (max-width: 700px) {

    h1 {
        font-size: 34px;
    }

    .panel {
        padding: 25px 18px;
    }

    .bloques,
    .opciones,
    .lista-clasificacion {
        grid-template-columns: 1fr;
    }

    #pregunta {
        font-size: 21px;
    }

    .palabra {
        font-size: 30px;
    }

}


</style>

<link rel="stylesheet" href="assets/css/core.css">
</head>


<body>
<a class="boton-inicio-global" href="index.html" onclick="irInicio(); return false;" aria-label="Volver a la página de inicio">⌂ Inicio</a>


<div class="contenedor">


<!-- =====================================================
     MENÚ
===================================================== -->

<div class="panel" id="menu">

<h1>🧩 Estructura de la palabra</h1>

<div class="subtitulo">
Lengua Castellana y Literatura
</div>

<h2>¿Qué quieres practicar?</h2>

<div class="introduccion">

Practica la estructura interna de las palabras mediante actividades progresivas y variadas.

</div>


<div class="bloques">


<button type="button" class="bloque"
onclick="iniciarBloque('identifica')">

<span class="icono">🔎</span>

<strong>Identifica</strong>

<span class="descripcion">
Reconoce, localiza y diferencia
lexemas, morfemas, afijos,
alomorfos e infijos
</span>

</button>


<button type="button" class="bloque"
onclick="iniciarBloque('clasifica')">

<span class="icono">🏷️</span>

<strong>Clasifica elementos</strong>

<span class="descripcion">
Distingue y analiza lexemas, morfemas flexivos,
afijos derivativos, interfijos y alomorfos
</span>

</button>


<button type="button" class="bloque"
onclick="iniciarBloque('analiza')">

<span class="icono">🧩</span>

<strong>Analiza</strong>

<span class="descripcion">
Segmentación, constituyentes, relaciones
entre elementos y formantes grecolatinos
</span>

</button>


<button type="button" class="bloque"
onclick="iniciarBloque('reto')">

<span class="icono">🏆</span>

<strong>Reto final</strong>

<span class="descripcion">
Análisis y aplicación de todos
los contenidos
</span>

</button>


</div>


<button type="button" class="boton"
onclick="volverMorfologia()">

← Volver a Morfología

</button>

</div>



<!-- =====================================================
     ACTIVIDAD
===================================================== -->

<div class="panel" id="actividad">

<div class="progreso-texto">

<span id="numeroPregunta">
Actividad 1 de 20
</span>

<span id="porcentaje">
0%
</span>

</div>


<div class="barra">

<div class="progreso"
id="barraProgreso">
</div>

</div>


<div class="etiqueta"
id="etiquetaActividad">
</div>


<div id="pregunta"></div>

<div id="palabra"
class="palabra">
</div>

<div id="contenidoActividad"></div>

<div id="feedback"></div>


<button type="button" class="boton boton-principal"
id="comprobar"
onclick="comprobar()">

Comprobar

</button>


<button type="button" class="boton"
id="siguiente"
onclick="siguientePregunta()">

Siguiente →

</button>


<br>


<button type="button" class="boton" id="adelante" onclick="adelante()">Adelante →</button>
<br>
<button type="button" class="boton"
onclick="volverMenu()">

← Volver a los bloques

</button>

</div>



<!-- =====================================================
     RESULTADO
===================================================== -->

<div class="panel" id="resultado">

<h2>🎉 ¡Actividad terminada!</h2><div class="estadistica">
        <strong id="resultadoMejor">0,0</strong>
        <span>mejor nota</span>
    </div>
    <div class="estadistica">
        <strong id="resultadoPartidas">0</strong>
        <span>partidas</span>
    </div>
</div>

<div id="nota"></div>

<div id="mensaje"></div>

<div class="separador"></div>

<button type="button" class="boton boton-principal"
onclick="repetirBloque()">

🔄 Nueva partida

</button>

<button type="button" class="boton"
onclick="volverMenu()">

← Volver a los bloques

</button>

</div>


</div>



<script src="assets/js/data/morfologia/estructura-palabra.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/estructura-palabra.js"></script>

</body>

</html>
