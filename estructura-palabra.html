<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estructura de la palabra · Docere et Delectare</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: #f4efe5;
            color: #2d2a26;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .contenedor {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 10px;
            letter-spacing: 1px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 35px;
            color: #625b51;
        }

        .panel {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        /* PROGRESO */

        .zona-progreso {
            margin-bottom: 30px;
        }

        .texto-progreso {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            color: #625b51;
        }

        .barra {
            width: 100%;
            height: 12px;
            background: #eee8dc;
            border-radius: 20px;
            overflow: hidden;
        }

        .barra-progreso {
            height: 100%;
            width: 0%;
            background: #8f8678;
            transition: width 0.4s ease;
        }

        /* PREGUNTA */

        #pregunta {
            font-size: 25px;
            line-height: 1.4;
            margin: 25px 0 30px;
        }

        .opciones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .opcion {
            padding: 20px;
            border: none;
            border-radius: 12px;
            background: #eee8dc;
            color: #2d2a26;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcion:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }

        .opcion:disabled {
            cursor: default;
        }

        .opcion.correcta {
            background: #dce8d8;
        }

        .opcion.incorrecta {
            background: #ead8d5;
        }

        /* FEEDBACK */

        #feedback {
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.6;
            text-align: left;
        }

        .correcto {
            color: #3f6841;
        }

        .incorrecto {
            color: #8a4038;
        }

        /* BOTONES */

        .boton {
            margin-top: 25px;
            padding: 13px 26px;
            border: none;
            border-radius: 10px;
            background: #ddd5c8;
            color: #2d2a26;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #cfc5b5;
        }

        /* RESULTADO */

        #resultado {
            display: none;
        }

        .nota {
            font-size: 48px;
            margin: 25px 0;
        }

        .mensaje-final {
            font-size: 20px;
            line-height: 1.6;
        }

        /* INICIO */

        .introduccion {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* MÓVIL */

        @media (max-width: 700px) {

            h1 {
                font-size: 36px;
            }

            .panel {
                padding: 25px;
            }

            .opciones {
                grid-template-columns: 1fr;
            }

            #pregunta {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>

    <div class="contenedor">

        <h1>🧩 Desmonta la palabra</h1>

        <div class="subtitulo">
            Estructura de la palabra · 4.º ESO
        </div>


        <!-- ACTIVIDAD -->

        <div class="panel" id="actividad">

            <div class="introduccion" id="introduccion">

                <strong>¿Preparado?</strong>

                <br>

                Vas a responder 20 preguntas sobre la estructura
                de las palabras.

            </div>


            <!-- PROGRESO -->

            <div class="zona-progreso">

                <div class="texto-progreso">

                    <span id="numeroPregunta">
                        Pregunta 1 de 20
                    </span>

                    <span id="porcentaje">
                        0%
                    </span>

                </div>

                <div class="barra">

                    <div
                        class="barra-progreso"
                        id="barraProgreso">
                    </div>

                </div>

            </div>


            <!-- PREGUNTA -->

            <h2 id="pregunta"></h2>


            <!-- OPCIONES -->

            <div
                class="opciones"
                id="opciones">
            </div>


            <!-- FEEDBACK -->

            <div id="feedback"></div>


            <!-- SIGUIENTE -->

            <button
                class="boton"
                id="siguiente"
                onclick="siguientePregunta()"
                style="display:none;">

                Siguiente →

            </button>

        </div>


        <!-- RESULTADO -->

        <div
            class="panel"
            id="resultado">

            <h2>🎉 Actividad terminada</h2>

            <div
                class="nota"
                id="notaFinal">
            </div>

            <div
                class="mensaje-final"
                id="mensajeFinal">
            </div>


            <button
                class="boton"
                onclick="reiniciarActividad()">

                🔄 Intentar de nuevo

            </button>

            <br>


            <button
                class="boton"
                onclick="window.location.href='morfologia.html'">

                ← Volver a Morfología

            </button>

        </div>

    </div>


    <script>

        /* ================================
           BANCO DE PREGUNTAS
        ================================= */

        const preguntas = [

            {
                pregunta: "¿Cuál es el lexema de «panadero»?",
                opciones: [
                    "pan-",
                    "-ader-",
                    "-o",
                    "panadero"
                ],
                correcta: 0,
                explicacion: "«pan-» es el lexema porque aporta el significado léxico fundamental."
            },

            {
                pregunta: "En «niñas», ¿qué morfema indica el género femenino?",
                opciones: [
                    "niñ-",
                    "-a",
                    "-s",
                    "ninguno"
                ],
                correcta: 1,
                explicacion: "El morfema flexivo «-a» indica género femenino."
            },

            {
                pregunta: "En «niñas», ¿qué morfema indica el número plural?",
                opciones: [
                    "niñ-",
                    "-a",
                    "-s",
                    "niñas"
                ],
                correcta: 2,
                explicacion: "El morfema flexivo «-s» indica número plural."
            },

            {
                pregunta: "¿Cuál es el lexema de «florista»?",
                opciones: [
                    "flor-",
                    "-ista",
                    "-a",
                    "florista"
                ],
                correcta: 0,
                explicacion: "«flor-» es el lexema porque contiene el significado léxico fundamental."
            },

            {
                pregunta: "En «florista», ¿qué elemento es un sufijo derivativo?",
                opciones: [
                    "flor-",
                    "-ista",
                    "-a",
                    "ninguno"
                ],
                correcta: 1,
                explicacion: "«-ista» es un sufijo derivativo que permite formar una nueva palabra."
            },

            {
                pregunta: "En «casitas», ¿qué elemento aporta el significado diminutivo?",
                opciones: [
                    "cas-",
                    "-a",
                    "-it-",
                    "-s"
                ],
                correcta: 2,
                explicacion: "«-it-» forma parte del sufijo apreciativo diminutivo «-ito/-ita»."
            },

            {
                pregunta: "En «gatitos», ¿qué morfema indica el número plural?",
                opciones: [
                    "gat-",
                    "-it-",
                    "-o-",
                    "-s"
                ],
                correcta: 3,
                explicacion: "El morfema «-s» indica número plural."
            },

            {
                pregunta: "¿Cuál es el lexema de «panadería»?",
                opciones: [
                    "pan-",
                    "-ader-",
                    "-ía",
                    "panadería"
                ],
                correcta: 0,
                explicacion: "«pan-» es el lexema y aporta el significado léxico fundamental."
            },

            {
                pregunta: "¿Qué tipo de morfema es «des-» en «deshacer»?",
                opciones: [
                    "Lexema",
                    "Prefijo derivativo",
                    "Morfema flexivo",
                    "Sufijo derivativo"
                ],
                correcta: 1,
                explicacion: "«des-» es un prefijo derivativo porque se sitúa delante del lexema."
            },

            {
                pregunta: "¿Qué tipo de morfema es «re-» en «releer»?",
                opciones: [
                    "Lexema",
                    "Sufijo derivativo",
                    "Prefijo derivativo",
                    "Morfema flexivo"
                ],
                correcta: 2,
                explicacion: "«re-» es un prefijo derivativo que expresa repetición."
            },

            {
                pregunta: "En «inútil», ¿qué elemento funciona como prefijo?",
                opciones: [
                    "in-",
                    "util-",
                    "-il",
                    "útil"
                ],
                correcta: 0,
                explicacion: "«in-» es un prefijo derivativo situado delante del lexema."
            },

            {
                pregunta: "¿Qué tipo de morfema es «-s» en «libros»?",
                opciones: [
                    "Lexema",
                    "Morfema derivativo",
                    "Morfema flexivo",
                    "Prefijo"
                ],
                correcta: 2,
                explicacion: "«-s» es un morfema flexivo que indica número plural."
            },

            {
                pregunta: "En «perrito», ¿qué elemento aporta el significado diminutivo?",
                opciones: [
                    "perr-",
                    "-it-",
                    "-o",
                    "-s"
                ],
                correcta: 1,
                explicacion: "«-it-» forma parte del sufijo apreciativo diminutivo «-ito»."
            },

            {
                pregunta: "En «caserón», ¿qué elemento aporta un valor aumentativo?",
                opciones: [
                    "cas-",
                    "-er-",
                    "-ón",
                    "-o"
                ],
                correcta: 2,
                explicacion: "«-ón» es un sufijo apreciativo aumentativo."
            },

            {
                pregunta: "¿Cuál de estas palabras contiene un prefijo derivativo?",
                opciones: [
                    "panadero",
                    "releer",
                    "florista",
                    "casita"
                ],
                correcta: 1,
                explicacion: "«releer» contiene el prefijo derivativo «re-»."
            },

            {
                pregunta: "¿Cuál de estas palabras contiene un sufijo derivativo?",
                opciones: [
                    "libros",
                    "niñas",
                    "florista",
                    "mesas"
                ],
                correcta: 2,
                explicacion: "«florista» contiene el sufijo derivativo «-ista»."
            },

            {
                pregunta: "¿Cuál de estos elementos es un morfema flexivo?",
                opciones: [
                    "re-",
                    "-ista",
                    "-s en «casas»",
                    "-ito"
                ],
                correcta: 2,
                explicacion: "La «-s» de «casas» es un morfema flexivo porque indica número plural."
            },

            {
                pregunta: "¿Cuál de estas palabras presenta un prefijo?",
                opciones: [
                    "releer",
                    "mesas",
                    "florista",
                    "niñas"
                ],
                correcta: 0,
                explicacion: "«releer» contiene el prefijo «re-»."
            },

            {
                pregunta: "¿Cuál es el lexema de «marinero»?",
                opciones: [
                    "mar-",
                    "-iner-",
                    "-o",
                    "marinero"
                ],
                correcta: 0,
                explicacion: "«mar-» es el lexema porque aporta el significado léxico relacionado con «mar»."
            },

            {
                pregunta: "¿Qué tipo de morfema es «-mente» en «rápidamente»?",
                opciones: [
                    "Prefijo derivativo",
                    "Sufijo derivativo",
                    "Morfema flexivo",
                    "Lexema"
                ],
                correcta: 1,
                explicacion: "«-mente» es un sufijo derivativo que permite formar adverbios a partir de adjetivos."
            }

        ];


        /* ================================
           VARIABLES
        ================================= */

        let preguntasMezcladas = [];

        let preguntaActual = 0;

        let puntuacion = 0;

        let respondida = false;


        /* ================================
           MEZCLAR PREGUNTAS
        ================================= */

        function mezclarPreguntas() {

            preguntasMezcladas = [...preguntas];

            for (
                let i = preguntasMezcladas.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(Math.random() * (i + 1));

                [
                    preguntasMezcladas[i],
                    preguntasMezcladas[j]
                ] = [
                    preguntasMezcladas[j],
                    preguntasMezcladas[i]
                ];

            }

        }


        /* ================================
           MOSTRAR PREGUNTA
        ================================= */

        function mostrarPregunta() {

            respondida = false;

            const pregunta =
                preguntasMezcladas[preguntaActual];


            document.getElementById(
                "numeroPregunta"
            ).textContent =
                "Pregunta " +
                (preguntaActual + 1) +
                " de " +
                preguntasMezcladas.length;


            const porcentaje =
                Math.round(
                    (preguntaActual /
                    preguntasMezcladas.length) * 100
                );


            document.getElementById(
                "porcentaje"
            ).textContent =
                porcentaje + "%";


            document.getElementById(
                "barraProgreso"
            ).style.width =
                porcentaje + "%";


            document.getElementById(
                "pregunta"
            ).textContent =
                pregunta.pregunta;


            document.getElementById(
                "feedback"
            ).innerHTML = "";


            document.getElementById(
                "siguiente"
            ).style.display =
                "none";


            const contenedor =
                document.getElementById(
                    "opciones"
                );


            contenedor.innerHTML = "";


            pregunta.opciones.forEach(
                (opcion, indice) => {

                    const boton =
                        document.createElement(
                            "button"
                        );

                    boton.className =
                        "opcion";

                    boton.textContent =
                        opcion;

                    boton.onclick =
                        function() {

                            comprobarRespuesta(
                                indice
                            );

                        };


                    contenedor.appendChild(
                        boton
                    );

                }
            );

        }


        /* ================================
           COMPROBAR RESPUESTA
        ================================= */

        function comprobarRespuesta(indice) {

            if (respondida) {
                return;
            }

            respondida = true;


            const pregunta =
                preguntasMezcladas[
                    preguntaActual
                ];


            const botones =
                document.querySelectorAll(
                    ".opcion"
                );


            botones.forEach(
                (boton, posicion) => {

                    boton.disabled = true;


                    if (
                        posicion ===
                        pregunta.correcta
                    ) {

                        boton.classList.add(
                            "correcta"
                        );

                    }

                }
            );


            if (
                indice ===
                pregunta.correcta
            ) {

                puntuacion++;


                botones[indice]
                    .classList.add(
                        "correcta"
                    );


                document.getElementById(
                    "feedback"
                ).innerHTML =
                    "<div class='correcto'>" +
                    "✅ <strong>¡Correcto!</strong>" +
                    "</div>" +
                    "<br>" +
                    pregunta.explicacion;

            } else {

                botones[indice]
                    .classList.add(
                        "incorrecta"
                    );


                document.getElementById(
                    "feedback"
                ).innerHTML =
                    "<div class='incorrecto'>" +
                    "❌ <strong>No es correcto.</strong>" +
                    "</div>" +
                    "<br>" +
                    "La respuesta correcta es: «" +
                    pregunta.opciones[
                        pregunta.correcta
                    ] +
                    "»." +
                    "<br><br>" +
                    pregunta.explicacion;

            }


            document.getElementById(
                "siguiente"
            ).style.display =
                "inline-block";

        }


        /* ================================
           SIGUIENTE PREGUNTA
        ================================= */

        function siguientePregunta() {

            preguntaActual++;


            if (
                preguntaActual <
                preguntasMezcladas.length
            ) {

                mostrarPregunta();

            } else {

                mostrarResultado();

            }

        }


        /* ================================
           RESULTADO
        ================================= */

        function mostrarResultado() {

            document.getElementById(
                "actividad"
            ).style.display =
                "none";


            document.getElementById(
                "resultado"
            ).style.display =
                "block";


            document.getElementById(
                "barraProgreso"
            ).style.width =
                "100%";


            document.getElementById(
                "porcentaje"
            ).textContent =
                "100%";


            const nota =
                (
                    puntuacion /
                    preguntasMezcladas.length
                ) * 10;


            document.getElementById(
                "notaFinal"
            ).textContent =
                nota.toFixed(1) +
                " / 10";


            let mensaje;


            if (nota >= 9) {

                mensaje =
                    "🏆 ¡Excelente! Dominas la estructura de la palabra.";

            } else if (nota >= 7) {

                mensaje =
                    "👏 ¡Muy bien! Tienes un buen dominio de los contenidos.";

            } else if (nota >= 5) {

                mensaje =
                    "👍 Has aprobado, pero todavía puedes mejorar.";

            } else {

                mensaje =
                    "📚 Necesitas repasar los contenidos y volver a intentarlo.";

            }


            document.getElementById(
                "mensajeFinal"
            ).textContent =
                mensaje;

        }


        /* ================================
           REINICIAR
        ================================= */

        function reiniciarActividad() {

            preguntaActual = 0;

            puntuacion = 0;

            mezclarPreguntas();


            document.getElementById(
                "resultado"
            ).style.display =
                "none";


            document.getElementById(
                "actividad"
            ).style.display =
                "block";


            mostrarPregunta();

        }


        /* ================================
           INICIAR
        ================================= */

        mezclarPreguntas();

        mostrarPregunta();

    </script>

</body>

</html>
