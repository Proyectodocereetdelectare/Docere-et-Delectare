/* =====================================================
   UTILIDADES
===================================================== */

function mezclar(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[+\-_|/]/g, "")
        .replace(/\s+/g, "")
        .trim();

}


function comparar(respuesta, soluciones) {

    const r = normalizar(respuesta);

    return soluciones.some(
        s => r === normalizar(s)
    );

}

/* =====================================================
   CREAR PARTIDA
===================================================== */

function crearPartida(tipo) {

    let banco;

    if (tipo === "identifica") banco = identifica;
    if (tipo === "clasifica") banco = clasifica;
    if (tipo === "analiza") banco = analiza;
    if (tipo === "reto") banco = reto;


    const seleccion = [];

    const usados = new Set();


    configuracion[tipo].forEach(
        ([tipoActividad, cantidad]) => {

            const candidatos =
                mezclar(
                    banco.filter(
                        actividad =>
                            actividad.tipo === tipoActividad
                    )
                );


            let contador = 0;


            for (
                let i = 0;
                i < candidatos.length &&
                contador < cantidad;
                i++
            ) {

                const actividad =
                    candidatos[i];


                const indice =
                    banco.indexOf(actividad);


                if (!usados.has(indice)) {

                    usados.add(indice);

                    seleccion.push(actividad);

                    contador++;

                }

            }

        }
    );


    /*
       Si algún tipo no dispone de suficientes
       ejercicios, completamos hasta 20.
    */

    if (seleccion.length < 20) {

        const restantes =
            mezclar(
                banco.filter(
                    actividad =>
                        !seleccion.includes(actividad)
                )
            );


        while (
            seleccion.length < 20 &&
            restantes.length > 0
        ) {

            seleccion.push(
                restantes.shift()
            );

        }

    }


    return seleccion.slice(0, 20);

}

/* =====================================================
   COMPROBAR
===================================================== */

function comprobar() {

    if (respondida) {
        return;
    }


    const actividad =
        actividadesActuales[actividadActual];


    let correcto = false;

    let explicacion =
        actividad.explicacion || "";


    /* TEST */

    if (actividad.tipo === "mcq") {

        if (
            window.respuestaMCQ === undefined
        ) {

            mostrarAviso(
                "Selecciona una respuesta antes de comprobar."
            );

            return;

        }


        correcto =
            window.respuestaMCQ ===
            actividad.correcta;

    }


    /* TEXTO */

    if (
        actividad.tipo === "texto" ||
        actividad.tipo === "segmentacion"
    ) {

        const input =
            document.getElementById(
                "respuestaTexto"
            );


        if (!input.value.trim()) {

            mostrarAviso(
                "Escribe una respuesta antes de comprobar."
            );

            return;

        }


        correcto =
            comparar(
                input.value,
                actividad.soluciones
            );

    }


    /* CLASIFICACIÓN */

    if (actividad.tipo === "clasificacion") {

        if (
            !window.respuestaClasificacion
        ) {

            mostrarAviso(
                "Selecciona una categoría antes de comprobar."
            );

            return;

        }


        correcto =
            window.respuestaClasificacion ===
            actividad.correcta;

    }


    /* ANÁLISIS */

    if (actividad.tipo === "analisis") {

        const inputs =
            document.querySelectorAll(
                "[data-campo]"
            );


        let total = inputs.length;

        let aciertos = 0;

        let respuestasCompletas = true;


        inputs.forEach(
            input => {

                const valor =
                    input.value.trim();


                if (!valor) {

                    respuestasCompletas =
                        false;

                    return;

                }


                const clave =
                    input.dataset.campo;


                const soluciones =
                    actividad.soluciones[clave] || [];


                if (
                    comparar(
                        valor,
                        soluciones
                    )
                ) {

                    aciertos++;

                }

            }
        );


        if (!respuestasCompletas) {

            mostrarAviso(
                "Completa todos los apartados antes de comprobar."
            );

            return;

        }


        correcto =
            aciertos === total;


        if (!correcto) {

            explicacion +=
                "<br><br><strong>" +
                aciertos +
                " de " +
                total +
                " apartados correctos.</strong>";

        }

    }


    respondida = true;


    if (correcto) {

        puntuacion++;

        mostrarFeedback(
            true,
            explicacion
        );

    } else {

        mostrarFeedback(
            false,
            obtenerSolucion(actividad, explicacion)
        );

    }


    document.getElementById("comprobar")
        .style.display =
        "none";


    document.getElementById("siguiente")
        .style.display =
        "inline-block";

}


/* =====================================================
   SOLUCIÓN
===================================================== */

function obtenerSolucion(
    actividad,
    explicacion
) {

    let texto = "";


    if (actividad.tipo === "mcq") {

        texto =
            "La respuesta correcta es: <strong>" +
            actividad.opciones[
                actividad.correcta
            ] +
            "</strong>";

    }


    if (
        actividad.tipo === "texto" ||
        actividad.tipo === "segmentacion"
    ) {

        texto =
            "Una respuesta válida es: <strong>" +
            actividad.soluciones[0] +
            "</strong>";

    }


    if (actividad.tipo === "clasificacion") {

        texto =
            "La clasificación correcta es: <strong>" +
            actividad.correcta +
            "</strong>";

    }


    if (actividad.tipo === "analisis") {

        texto =
            "<strong>Solución:</strong><br>";

        actividad.campos.forEach(
            campo => {

                const soluciones =
                    actividad.soluciones[
                        campo[0]
                    ];


                if (soluciones) {

                    texto +=
                        "<br><strong>" +
                        campo[1] +
                        ":</strong> " +
                        soluciones[0];

                }

            }
        );

    }


    return texto +
        "<br><br>" +
        explicacion;

}


/* =====================================================
   FEEDBACK
===================================================== */

function mostrarFeedback(
    correcto,
    texto
) {

    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        correcto
            ? "feedback exito"
            : "feedback error";


    feedback.innerHTML =
        correcto
            ? "✅ <strong>¡Correcto!</strong><br><br>" +
              texto
            : "❌ <strong>Hay algún error.</strong><br><br>" +
              texto;

}


/* =====================================================
   AVISO
===================================================== */

function mostrarAviso(texto) {

    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.className =
        "feedback";


    feedback.innerHTML =
        "⚠️ " + texto;

}


/* =====================================================
   SIGUIENTE
===================================================== */

function siguientePregunta() {

    actividadActual++;


    if (
        actividadActual <
        actividadesActuales.length
    ) {

        window.respuestaMCQ =
            undefined;

        window.respuestaClasificacion =
            undefined;

        mostrarActividad();

    } else {

        mostrarResultado();

    }

}


/* =====================================================
   RESULTADO
===================================================== */

function mostrarResultado() {

    document.getElementById("actividad")
        .style.display =
        "none";


    document.getElementById("resultado")
        .style.display =
        "block";


    const nota =
        (
            puntuacion /
            actividadesActuales.length
        ) * 10;


    document.getElementById("nota")
        .textContent =
        nota.toFixed(1) +
        " / 10";


    let mensaje;


    if (nota >= 9) {

        mensaje =
            "🏆 ¡Excelente! Dominas muy bien la estructura de la palabra.";

    }

    else if (nota >= 7) {

        mensaje =
            "👏 ¡Muy bien! Tienes un buen dominio de estos contenidos.";

    }

    else if (nota >= 5) {

        mensaje =
            "👍 Has aprobado. Conviene seguir practicando algunos contenidos.";

    }

    else {

        mensaje =
            "📚 Necesitas repasar y volver a practicar.";

    }


    document.getElementById("mensaje")
        .textContent =
        mensaje;

}


/* =====================================================
   REPETIR
===================================================== */

function repetirBloque() {

    window.respuestaMCQ =
        undefined;

    window.respuestaClasificacion =
        undefined;

    iniciarBloque(
        bloqueActual
    );

}


/* =====================================================
   VOLVER AL MENÚ
===================================================== */

function volverMenu() {

    document.getElementById("actividad")
        .style.display =
        "none";


    document.getElementById("resultado")
        .style.display =
        "none";


    document.getElementById("menu")
        .style.display =
        "block";

}


/* =====================================================
   VOLVER A MORFOLOGÍA
===================================================== */

function volverMorfologia() {

    window.location.href =
        "morfologia.html";

}
