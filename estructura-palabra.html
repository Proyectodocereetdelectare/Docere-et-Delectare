/* =====================================================
   VARIABLES
===================================================== */

let actividadActual = "";

let preguntasActuales = [];

let preguntaActual = 0;

let puntuacion = 0;

let respondida = false;


/* =====================================================
   NOMBRES
===================================================== */

const nombres = {

identifica: "🔎 Identifica",

clasifica: "🏷️ Clasifica",

analiza: "🧩 Analiza",

reto: "🏆 Reto final"

};


/* =====================================================
   INICIAR ACTIVIDAD
===================================================== */

function iniciarActividad(tipo) {

    actividadActual = tipo;

    if (tipo === "identifica") {
        preguntasActuales = [...identifica];
    }

    if (tipo === "clasifica") {
        preguntasActuales = [...clasifica];
    }

    if (tipo === "analiza") {
        preguntasActuales = [...analiza];
    }

    if (tipo === "reto") {
        preguntasActuales = [...reto];
    }

    preguntasActuales =
        mezclar(preguntasActuales);

    preguntaActual = 0;

    puntuacion = 0;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("resultado")
        .style.display = "none";

    document.getElementById("actividad")
        .style.display = "block";

    document.getElementById("nombreActividad")
        .textContent = nombres[tipo];

    mostrarPregunta();

}


/* =====================================================
   MEZCLAR
===================================================== */

function mezclar(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =====================================================
   MOSTRAR PREGUNTA
===================================================== */

function mostrarPregunta() {

    respondida = false;

    const pregunta =
        preguntasActuales[preguntaActual];


    document.getElementById("numeroPregunta")
        .textContent =
        "Pregunta " +
        (preguntaActual + 1) +
        " de " +
        preguntasActuales.length;


    const porcentaje =
        Math.round(
            (preguntaActual /
            preguntasActuales.length) * 100
        );


    document.getElementById("porcentaje")
        .textContent =
        porcentaje + "%";


    document.getElementById("barraProgreso")
        .style.width =
        porcentaje + "%";


    document.getElementById("pregunta")
        .textContent =
        pregunta.pregunta;


    document.getElementById("palabra")
        .textContent = "";


    document.getElementById("feedback")
        .innerHTML = "";


    document.getElementById("siguiente")
        .style.display = "none";


    const contenedor =
        document.getElementById("opciones");


    contenedor.innerHTML = "";


    pregunta.opciones.forEach(
        (opcion, indice) => {

            const boton =
                document.createElement("button");

            boton.className = "opcion";

            boton.textContent = opcion;

            boton.onclick =
                function() {

                    comprobarRespuesta(indice);

                };

            contenedor.appendChild(boton);

        }
    );

}


/* =====================================================
   COMPROBAR
===================================================== */

function comprobarRespuesta(indice) {

    if (respondida) {
        return;
    }

    respondida = true;


    const pregunta =
        preguntasActuales[preguntaActual];


    const botones =
        document.querySelectorAll(".opcion");


    botones.forEach(
        (boton, posicion) => {

            boton.disabled = true;

            if (
                posicion === pregunta.correcta
            ) {

                boton.classList.add("correcta");

            }

        }
    );


    if (
        indice === pregunta.correcta
    ) {

        puntuacion++;

        document.getElementById("feedback")
            .innerHTML =
            "✅ <strong>¡Correcto!</strong><br><br>" +
            pregunta.explicacion;

    } else {

        botones[indice]
            .classList.add("incorrecta");

        document.getElementById("feedback")
            .innerHTML =
            "❌ <strong>No es correcto.</strong><br><br>" +
            "La respuesta correcta es: <strong>" +
            pregunta.opciones[pregunta.correcta] +
            "</strong><br><br>" +
            pregunta.explicacion;

    }


    document.getElementById("siguiente")
        .style.display =
        "inline-block";

}


/* =====================================================
   SIGUIENTE
===================================================== */

function siguientePregunta() {

    preguntaActual++;


    if (
        preguntaActual <
        preguntasActuales.length
    ) {

        mostrarPregunta();

    } else {

        mostrarResultado();

    }

}


/* =====================================================
   RESULTADO
===================================================== */

function mostrarResultado() {

    document.getElementById("actividad")
        .style.display =
        "none";

    document.getElementById("resultado")
        .style.display =
        "block";


    const nota =
        (
            puntuacion /
            preguntasActuales.length
        ) * 10;


    document.getElementById("nota")
        .textContent =
        nota.toFixed(1) +
        " / 10";


    let mensaje;


    if (nota >= 9) {

        mensaje =
            "🏆 ¡Excelente! Dominas muy bien estos contenidos.";

    }

    else if (nota >= 7) {

        mensaje =
            "👏 ¡Muy bien! Tienes un buen dominio de la estructura de la palabra.";

    }

    else if (nota >= 5) {

        mensaje =
            "👍 Has aprobado. Conviene repasar algunos conceptos.";

    }

    else {

        mensaje =
            "📚 Necesitas repasar este contenido y volver a intentarlo.";

    }


    document.getElementById("mensaje")
        .textContent =
        mensaje;

}


/* =====================================================
   REPETIR
===================================================== */

function repetirActividad() {

    iniciarActividad(actividadActual);

}


/* =====================================================
   VOLVER AL MENÚ
===================================================== */

function volverMenu() {

    document.getElementById("actividad")
        .style.display =
        "none";

    document.getElementById("resultado")
        .style.display =
        "none";

    document.getElementById("menu")
        .style.display =
        "block";

}


/* =====================================================
   VOLVER A MORFOLOGÍA
===================================================== */

function volverMorfologia() {

    window.location.href =
        "morfologia.html";

}
