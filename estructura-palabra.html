<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Estructura de la palabra · Docere et Delectare</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: #f4efe5;
    color: #2d2a26;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.contenedor {
    width: 100%;
    max-width: 950px;
    text-align: center;
}

h1 {
    font-size: 46px;
    margin: 0 0 10px;
}

.subtitulo {
    font-size: 20px;
    color: #625b51;
    margin-bottom: 35px;
}

.panel {
    background: white;
    padding: 40px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

h2 {
    margin-top: 0;
}

.introduccion {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.bloques {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.bloque {
    border: none;
    border-radius: 15px;
    padding: 25px 18px;
    background: #eee8dc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.bloque:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.icono {
    display: block;
    font-size: 35px;
    margin-bottom: 12px;
}

.descripcion {
    display: block;
    font-size: 14px;
    color: #625b51;
    margin-top: 8px;
    line-height: 1.4;
}

.boton {
    margin-top: 25px;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #ddd5c8;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    cursor: pointer;
}

.boton:hover {
    background: #cfc5b5;
}

#actividad,
#resultado {
    display: none;
}

.progreso-texto {
    display: flex;
    justify-content: space-between;
    color: #625b51;
    font-size: 15px;
    margin-bottom: 8px;
}

.barra {
    height: 12px;
    background: #eee8dc;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progreso {
    height: 100%;
    width: 0%;
    background: #8f8678;
    transition: width 0.3s;
}

#pregunta {
    font-size: 25px;
    line-height: 1.5;
    margin-bottom: 30px;
}

.opciones {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.opcion {
    padding: 20px;
    border: none;
    border-radius: 12px;
    background: #eee8dc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    cursor: pointer;
}

.opcion:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.12);
}

.opcion:disabled {
    cursor: default;
}

.correcta {
    background: #dce8d8 !important;
}

.incorrecta {
    background: #ead8d5 !important;
}

#feedback {
    margin-top: 25px;
    font-size: 17px;
    line-height: 1.6;
    text-align: left;
}

#nota {
    font-size: 48px;
    margin: 25px;
}

#mensaje {
    font-size: 20px;
    line-height: 1.6;
}

@media (max-width: 700px) {

    h1 {
        font-size: 35px;
    }

    .panel {
        padding: 25px;
    }

    .bloques,
    .opciones {
        grid-template-columns: 1fr;
    }

    #pregunta {
        font-size: 21px;
    }

}

</style>

</head>

<!-- ========================= -->

<div class="panel" id="actividad">

</span>

<span id="porcentaje">

</div>

<button class="boton"

<div class="panel"

</div>


</div>

opciones: [

],
correcta: 1,

"«bio» significa «vida»."
},

{
pregunta: "¿Qué significa «geo»?",
opciones: [
"Tierra",

],
correcta: 0,
explicacion:

pregunta: "¿Qué significa «foto»?",
opciones: [

"«foto» significa «luz»."

},

{

opciones: [

],
correcta: 1,

},

{
pregunta: "¿Qué significa «cardio»?",
opciones: [
"Piel",
"Corazón",
"Tierra",
"Lejos"
],
correcta: 1,
explicacion:
"«cardio» significa «corazón»."
},

{
pregunta: "¿Qué significa «fobia»?",
opciones: [
"Estudio",
"Observar",
"Temor o aversión",
"Escribir"
],
correcta: 2,

"«fobia» expresa temor o aversión."

const nombresBloques = [

"🧱 Estructura de la palabra",

"🌱 Derivación y composición",

"🧬 Parasíntesis y acronimia",

"🏛️ Formantes grecolatinos",

"🎯 Reto global"

];


let preguntasActuales = [];

let preguntaActual = 0;

let puntuacion = 0;

let bloqueSeleccionado = 0;

let respondida = false;


/* =====================================
   MEZCLAR
===================================== */

function mezclar(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =====================================
   INICIAR BLOQUE
===================================== */

function iniciarBloque(numero) {

    bloqueSeleccionado = numero;

    preguntasActuales =
        mezclar(bancos[numero]);

    preguntaActual = 0;

    puntuacion = 0;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("resultado")
        .style.display = "none";

    document.getElementById("actividad")
        .style.display = "block";

    document.getElementById("tituloBloque")
        .textContent =
        nombresBloques[numero];

    mostrarPregunta();

}


/* =====================================
   RETO GLOBAL
===================================== */

function iniciarRetoGlobal() {

    bloqueSeleccionado = 4;

    preguntasActuales =
        mezclar([
            ...bancos[0],
            ...bancos[1],
            ...bancos[2],
            ...bancos[3]
        ]);

    preguntaActual = 0;

    puntuacion = 0;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("resultado")
        .style.display = "none";

    document.getElementById("actividad")
        .style.display = "block";

    document.getElementById("tituloBloque")
        .textContent =
        "🎯 Reto global";

    mostrarPregunta();

}


/* =====================================
   MOSTRAR PREGUNTA
===================================== */

function mostrarPregunta() {

    respondida = false;

    const pregunta =
        preguntasActuales[preguntaActual];


    document.getElementById("numeroPregunta")
        .textContent =
        "Pregunta " +
        (preguntaActual + 1) +
        " de " +
        preguntasActuales.length;


    const porcentaje =
        Math.round(
            (preguntaActual /
            preguntasActuales.length) * 100
        );


    document.getElementById("porcentaje")
        .textContent =
        porcentaje + "%";


    document.getElementById("barraProgreso")
        .style.width =
        porcentaje + "%";


    document.getElementById("pregunta")
        .textContent =
        pregunta.pregunta;


    document.getElementById("feedback")
        .innerHTML = "";


    document.getElementById("siguiente")
        .style.display =
        "none";


    const contenedor =
        document.getElementById("opciones");


    contenedor.innerHTML = "";


    pregunta.opciones.forEach(
        (opcion, indice) => {

            const boton =
                document.createElement("button");

            boton.className = "opcion";

            boton.textContent = opcion;

            boton.onclick =
                function() {

                    comprobarRespuesta(indice);

                };

            contenedor.appendChild(boton);

        }
    );

}


/* =====================================
   COMPROBAR
===================================== */

function comprobarRespuesta(indice) {

    if (respondida) {
        return;
    }

    respondida = true;


    const pregunta =
        preguntasActuales[preguntaActual];


    const botones =
        document.querySelectorAll(".opcion");


    botones.forEach(
        (boton, posicion) => {

            boton.disabled = true;

            if (
                posicion === pregunta.correcta
            ) {

                boton.classList.add("correcta");

            }

        }
    );


    if (
        indice === pregunta.correcta
    ) {

        puntuacion++;

        document.getElementById("feedback")
            .innerHTML =
            "✅ <strong>¡Correcto!</strong><br><br>" +
            pregunta.explicacion;

    } else {

        botones[indice]
            .classList.add("incorrecta");

        document.getElementById("feedback")
            .innerHTML =
            "❌ <strong>No es correcto.</strong><br><br>" +
            "La respuesta correcta es: <strong>" +
            pregunta.opciones[pregunta.correcta] +
            "</strong><br><br>" +
            pregunta.explicacion;

    }


    document.getElementById("siguiente")
        .style.display =
        "inline-block";

}


/* =====================================
   SIGUIENTE
===================================== */

function siguientePregunta() {

    preguntaActual++;


    if (
        preguntaActual <
        preguntasActuales.length
    ) {

        mostrarPregunta();

    } else {

        mostrarResultado();

    }

}


/* =====================================
   RESULTADO
===================================== */

function mostrarResultado() {

    document.getElementById("actividad")
        .style.display =
        "none";

    document.getElementById("resultado")
        .style.display =
        "block";


    document.getElementById("barraProgreso")
        .style.width =
        "100%";


    document.getElementById("porcentaje")
        .textContent =
        "100%";


    const nota =
        (
            puntuacion /
            preguntasActuales.length
        ) * 10;


    document.getElementById("nota")
        .textContent =
        nota.toFixed(1) +
        " / 10";


    let mensaje;


    if (nota >= 9) {

        mensaje =
            "🏆 ¡Excelente! Dominas muy bien estos contenidos.";

    }

    else if (nota >= 7) {

        mensaje =
            "👏 ¡Muy bien! Tienes un buen dominio del tema.";

    }

    else if (nota >= 5) {

        mensaje =
            "👍 Has aprobado. Conviene seguir practicando.";

    }

    else {

        mensaje =
            "📚 Necesitas repasar este bloque y volver a intentarlo.";

    }


    document.getElementById("mensaje")
        .textContent =
        mensaje;

}


/* =====================================
   REPETIR
===================================== */

function repetirActividad() {

    if (bloqueSeleccionado === 4) {

        iniciarRetoGlobal();

    } else {

        iniciarBloque(
            bloqueSeleccionado
        );

    }

}

    document.getElementById("resultado")

    document.getElementById("actividad")
        .style.display =
        "none";

    document.getElementById("menu")
        .style.display =

}
